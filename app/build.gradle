        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        viewBinding = true
    }

    packaging {
        resources {
            // Exclude duplicate OSGI MANIFEST entries from dependencies (okhttp logging-interceptor, jspecify etc.)
            // Keep these exclusions narrow to avoid removing useful metadata from other libs.
            excludes += [
                "META-INF/versions/**/OSGI-INF/MANIFEST.MF",
                "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
            ]
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}


