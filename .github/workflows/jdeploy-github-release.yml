name: Publish jDeploy GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: jdeploy-github-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish-github-release:
    name: Publish GitHub release installers
    runs-on: macos-latest
    env:
      RADIO_ORACLE_RELEASE_BUILD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Print tool versions
        run: |
          java -version
          node --version
          npm --version

      - name: Verify release tag matches package version
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const tag = process.env.GITHUB_REF_NAME || "";
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const expectedTag = `v${packageJson.version}`;
          if (tag !== expectedTag) {
            console.error(`Release tag ${tag} does not match package.json version ${packageJson.version}. Expected ${expectedTag}.`);
            process.exit(1);
          }
          NODE

      - name: Install npm dependencies
        run: npm ci

      - name: Run desktop and Android regression gates
        run: |
          ./gradlew \
            :shared:desktopTest \
            :desktopApp:test \
            :shared:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :desktopApp:checkRuntime \
            :desktopApp:prepareDesktopJdeployBundle \
            :desktopApp:verifyDesktopJdeployBundle

      - name: Run jDeploy release preflight
        run: npm run jdeploy:release-preflight

      - name: Publish installer assets with jDeploy
        uses: shannah/jdeploy@master
        with:
          github_token: ${{ github.token }}
          deploy_target: github
          jdeploy_version: "6.1.3"

      - name: Upload canonical npm package tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack --ignore-scripts
          gh release upload "${{ github.ref_name }}" openardf-radio-oracle-*.tgz --clobber

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
