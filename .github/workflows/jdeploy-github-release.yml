name: Publish jDeploy GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: jdeploy-github-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish-github-release:
    name: Publish GitHub release installers
    # Pin the release environment so a future moving-label migration cannot alter a tag build.
    runs-on: macos-26
    env:
      RADIO_ORACLE_RELEASE_BUILD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Print tool versions
        run: |
          java -version
          node --version
          npm --version

      - name: Verify release tag matches package version
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const tag = process.env.GITHUB_REF_NAME || "";
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const expectedTag = `v${packageJson.version}`;
          if (tag !== expectedTag) {
            console.error(`Release tag ${tag} does not match package.json version ${packageJson.version}. Expected ${expectedTag}.`);
            process.exit(1);
          }
          NODE

      - name: Install npm dependencies
        run: npm ci

      - name: Run desktop and Android regression gates
        run: |
          ./gradlew \
            :shared:desktopTest \
            :desktopApp:test \
            :shared:testAndroidHostTest \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :desktopApp:checkRuntime \
            :desktopApp:prepareDesktopJdeployBundle \
            :desktopApp:verifyDesktopJdeployBundle

      - name: Run jDeploy release preflight
        run: npm run jdeploy:release-preflight

      - name: Use GitHub-safe jDeploy package identity
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const githubPackageName = "radio-oracle";
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          packageJson.name = githubPackageName;
          fs.writeFileSync("package.json", `${JSON.stringify(packageJson, null, 2)}\n`);

          const packageLock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          packageLock.name = githubPackageName;
          if (packageLock.packages?.[""]) {
            packageLock.packages[""].name = githubPackageName;
          }
          fs.writeFileSync("package-lock.json", `${JSON.stringify(packageLock, null, 2)}\n`);
          NODE

      - name: Prepare installer assets with jDeploy
        env:
          GH_TOKEN: ${{ github.token }}
          JDEPLOY_REGISTRY_URL: https://www.jdeploy.com/
        run: node ./scripts/prepare-jdeploy-github-release.mjs

      - name: Publish jDeploy metadata and installer assets
        env:
          GH_TOKEN: ${{ github.token }}
          RADIO_ORACLE_ALLOW_GITHUB_RELEASE_PUBLISH: "1"
        run: ./scripts/publish-jdeploy-github-release.sh

      - name: Patch macOS installer icons
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "${{ github.ref_name }}" --pattern 'Radio-Oracle.Installer-mac-*.tgz' --dir release-assets --clobber
          node ./scripts/patch-jdeploy-macos-installer-icons.mjs release-assets
          gh release upload "${{ github.ref_name }}" release-assets/Radio-Oracle.Installer-mac-*.tgz --clobber

      - name: Upload GitHub jDeploy package tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack --ignore-scripts
          gh release upload "${{ github.ref_name }}" radio-oracle-*.tgz --clobber

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
