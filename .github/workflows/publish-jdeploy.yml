name: Publish jDeploy Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish, matching package.json"
        required: true
        type: string
      mode:
        description: "Run a dry run or publish to npm"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      runner:
        description: "Runner image used for release-lane validation"
        required: true
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-26.04

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-radio-oracle
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @openardf/radio-oracle
    # Release automation remains reproducible while Ubuntu 26 can be selected for a dry run.
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    environment: npm-publish
    env:
      RADIO_ORACLE_ALLOW_JDEPLOY_PUBLISH: "1"
      RADIO_ORACLE_RELEASE_BUILD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        id: setup-java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Print tool versions
        run: |
          java -version
          node --version
          npm --version

      - name: Verify requested version
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const requested = process.env.REQUESTED_VERSION;
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (packageJson.version !== requested) {
            console.error(`Workflow input version ${requested} does not match package.json version ${packageJson.version}.`);
            process.exit(1);
          }
          NODE
        env:
          REQUESTED_VERSION: ${{ inputs.version }}

      - name: Install npm dependencies
        run: npm ci

      - name: Run desktop and Android regression gates
        run: |
          ./gradlew \
            :shared:desktopTest \
            :desktopApp:test \
            :shared:testAndroidHostTest \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :desktopApp:checkRuntime \
            :desktopApp:prepareDesktopJdeployBundle \
            :desktopApp:verifyDesktopJdeployBundle

      - name: Run jDeploy release preflight
        run: npm run jdeploy:release-preflight

      - name: Build npm package preview
        run: npm run jdeploy:pack-preview

      - name: Publish to npm with trusted publishing
        if: inputs.mode == 'publish'
        run: node ./scripts/publish-jdeploy-trusted.mjs

      - name: Dry-run complete
        if: inputs.mode != 'publish'
        run: echo "Dry-run completed. Re-run with mode=publish to publish ${{ inputs.version }}."
