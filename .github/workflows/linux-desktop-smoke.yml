name: Linux x64 installed desktop smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [Development1]
    paths:
      - ".github/workflows/linux-desktop-smoke.yml"
      - "build.gradle"
      - "desktopApp/**"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "package-lock.json"
      - "package.json"
      - "samples/desktop-smoke.rom.json"
      - "scripts/jdeploy-*.mjs"
      - "settings.gradle"
      - "shared/**"
  push:
    branches: [Development1]
    paths:
      - ".github/workflows/linux-desktop-smoke.yml"
      - "build.gradle"
      - "desktopApp/**"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "package-lock.json"
      - "package.json"
      - "samples/desktop-smoke.rom.json"
      - "scripts/jdeploy-*.mjs"
      - "settings.gradle"
      - "shared/**"

permissions:
  contents: read

concurrency:
  group: linux-desktop-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-smoke:
    name: Install, export, and launch the jDeploy app
    # Pin the x64 image; Linux support remains best-effort until wider native acceptance is repeatable.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Install, export from, and launch Radio-Oracle through jDeploy
        # Compose needs a display even though this acceptance lane does not interact with the UI.
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npm run jdeploy:local-smoke
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x64-installed-smoke-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ env.HOME }}/.jdeploy/log/**
            ${{ env.HOME }}/.local/state/Radio-Oracle/logs/**
            desktopApp/build/reports/**
