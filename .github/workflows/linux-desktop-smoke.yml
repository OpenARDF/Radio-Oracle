name: Linux installed desktop smoke

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional published release tag to install and probe on ARM64
        required: false
        type: string
  pull_request:
    branches: [Development1]
    paths:
      - ".github/workflows/linux-desktop-smoke.yml"
      - "build.gradle"
      - "desktopApp/**"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "package-lock.json"
      - "package.json"
      - "samples/desktop-smoke.rom.json"
      - "scripts/jdeploy-*.mjs"
      - "settings.gradle"
      - "shared/**"
  push:
    branches: [Development1]
    paths:
      - ".github/workflows/linux-desktop-smoke.yml"
      - "build.gradle"
      - "desktopApp/**"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "package-lock.json"
      - "package.json"
      - "samples/desktop-smoke.rom.json"
      - "scripts/jdeploy-*.mjs"
      - "settings.gradle"
      - "shared/**"

permissions:
  contents: read

concurrency:
  group: linux-desktop-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x64-installed-smoke:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.release_tag == ''
    name: Install, export, and launch the jDeploy app (x64)
    # Pin the x64 image; Linux support remains best-effort until wider native acceptance is repeatable.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set the checkout initialization branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Install, export from, and launch Radio-Oracle through jDeploy
        # Compose needs a display even though this acceptance lane does not interact with the UI.
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npm run jdeploy:local-smoke
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x64-installed-smoke-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ env.HOME }}/.jdeploy/log/**
            ${{ env.HOME }}/.local/state/Radio-Oracle/logs/**
            desktopApp/build/reports/**

  arm64-installed-smoke:
    name: Install, export, and launch the jDeploy app (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Set the checkout initialization branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.release_tag == ''
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Require a native ARM64 Node process
        run: |
          mkdir -p smoke-diagnostics
          node_architecture="$(node -p process.arch)"
          printf 'machine=%s\nnodeArchitecture=%s\nreleaseTag=%s\n' \
            "$(uname -m)" "$node_architecture" "${{ github.event.inputs.release_tag }}" \
            > smoke-diagnostics/runtime.txt
          test "$(uname -m)" = "aarch64"
          test "$node_architecture" = "arm64"
      - name: Install npm dependencies
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.release_tag == ''
        run: npm ci
      - name: Install, export from, and launch the candidate through jDeploy
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.release_tag == ''
        # Compose needs a display even though this acceptance lane does not interact with the UI.
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npm run jdeploy:local-smoke
      - name: Download the published ARM64 installer
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Radio-Oracle.Installer-linux-arm64-*.tar.gz' \
            --dir release-assets
          mapfile -t installers < <(find release-assets -maxdepth 1 -type f -name '*.tar.gz')
          if [[ "${#installers[@]}" -ne 1 ]]; then
            echo "Expected exactly one Linux ARM64 installer, found ${#installers[@]}." >&2
            exit 1
          fi
          mkdir -p release-assets/installer
          tar -xzf "${installers[0]}" -C release-assets/installer
          mapfile -t extracted < <(find release-assets/installer -maxdepth 1 -type f)
          if [[ "${#extracted[@]}" -ne 1 ]]; then
            echo "Expected exactly one extracted installer, found ${#extracted[@]}." >&2
            exit 1
          fi
      - name: Install and probe the published ARM64 release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag such as v1.0.52" >&2
            exit 1
          fi
          installer="$(find release-assets/installer -maxdepth 1 -type f)"
          chmod 0755 "$installer"
          # Public jDeploy installers bootstrap their installer package before installing the app.
          "$installer" --jdeploy:update
          "$installer" --jdeploy:command=install
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            node scripts/jdeploy-local-smoke.mjs \
              --probe-only "${RELEASE_TAG#v}" \
              --source https://github.com/OpenARDF/Radio-Oracle
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-arm64-installed-smoke-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            smoke-diagnostics/**
            ~/.jdeploy/log/**
            ~/.jdeploy/manifests/**/uninstall-manifest.xml
            ~/.local/state/Radio-Oracle/logs/**
            desktopApp/build/reports/**
