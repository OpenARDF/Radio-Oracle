name: Android native compatibility

on:
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image used for maintenance validation"
        required: true
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-26.04
  pull_request:
    paths:
      - ".github/fixtures/google-services-ci.json"
      - ".github/workflows/android-native-compatibility.yml"
      - "app/build.gradle"
      - "build.gradle"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/**"
      - "settings.gradle"
      - "shared/build.gradle"
      - "scripts/android-16kb-device-smoke.mjs"
      - "scripts/check-android-native-compatibility.mjs"
      - "scripts/check-android-native-compatibility.test.mjs"
  push:
    branches: [Development1]
    paths:
      - ".github/fixtures/google-services-ci.json"
      - ".github/workflows/android-native-compatibility.yml"
      - "app/build.gradle"
      - "build.gradle"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/**"
      - "settings.gradle"
      - "shared/build.gradle"
      - "scripts/android-16kb-device-smoke.mjs"
      - "scripts/check-android-native-compatibility.mjs"
      - "scripts/check-android-native-compatibility.test.mjs"

permissions:
  contents: read

concurrency:
  group: android-native-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-16kb:
    name: Bundle and 16 KB emulator smoke
    # Keep the monthly smoke stable while making Ubuntu 26 validation an explicit maintenance run.
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 35
    steps:
      - name: Set the checkout initialization branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
          packages: ''
      - name: Install dependencies and Android platform
        run: |
          npm ci
          # cmdline-tools 22 deprecates sdkmanager in favor of this Android CLI command.
          android sdk install platform-tools platforms/android-37.0
      - name: Enable Firebase dependencies with nonfunctional CI metadata
        run: cp .github/fixtures/google-services-ci.json app/google-services.json
      - name: Build and inspect Firebase-enabled Android artifacts
        run: |
          ./scripts/gradle-sequential.sh :app:bundleDebug :app:assembleDebug
          node --test scripts/check-android-native-compatibility.test.mjs
          node scripts/check-android-native-compatibility.mjs app/build/outputs/bundle/debug/app-debug.aab
          ./gradlew --stop
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on an Android 15 16 KB emulator
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_7
          # The Google APIs image exhausts the Pixel 7 profile default during its first-boot service initialization.
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: node scripts/android-16kb-device-smoke.mjs app/build/outputs/apk/debug/app-debug.apk
