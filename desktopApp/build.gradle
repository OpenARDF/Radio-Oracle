def desktopMainClass = "org.openardf.radiooracle.desktop.MainKt"
def desktopAppName = "Radio-Oracle"
def desktopDistributableDir = layout.buildDirectory.dir("compose/binaries/main/app")
def desktopJdeployBundleDir = layout.buildDirectory.dir("jdeploy")
def desktopJdeployLibsDir = desktopJdeployBundleDir.map { it.dir("libs") }
def desktopJdeployJarName = "Radio-Oracle-jdeploy.jar"
def runtimeClasspath = configurations.runtimeClasspath
def desktopImplementationVersion = version.toString()
def desktopBaseVersion = rootProject.ext.radioOracleVersion.toString()
def desktopBuildInfoDir = layout.buildDirectory.dir("generated/source/desktopBuildInfo/kotlin")
def desktopBuildSuffixFile = layout.projectDirectory.file(".gradle/desktop-build-suffix.txt")

sourceSets {
    main.kotlin.srcDir(desktopBuildInfoDir)
}

def shouldIncrementDesktopBuildSuffix = gradle.startParameter.taskNames.any { taskName ->
    def normalizedTaskName = taskName.toLowerCase(Locale.ROOT)
    normalizedTaskName.contains("createdistributable") ||
            normalizedTaskName.contains("packagedistribution") ||
            normalizedTaskName.contains("packagedmg") ||
            normalizedTaskName.contains("packagemsi") ||
            normalizedTaskName.contains("packagedeb") ||
            normalizedTaskName.contains("predesktopjdeploy") ||
            normalizedTaskName.contains("desktopjdeploy") ||
            normalizedTaskName.endsWith(":desktopapp:run") ||
            normalizedTaskName == "run"
}

tasks.register("generateDesktopBuildInfo") {
    group = "build"
    description = "Generates desktop build metadata shown in the app window."

    inputs.property("baseVersion", desktopBaseVersion)
    inputs.property("shouldIncrementDesktopBuildSuffix", shouldIncrementDesktopBuildSuffix)
    outputs.dir(desktopBuildInfoDir)
    outputs.upToDateWhen { false }

    doLast {
        def suffixFile = desktopBuildSuffixFile.asFile
        def currentSuffix = suffixFile.isFile() ? suffixFile.text.trim() : ""
        def buildSuffix = currentSuffix
        if (shouldIncrementDesktopBuildSuffix) {
            if (currentSuffix.isBlank()) {
                buildSuffix = "a"
            } else {
                def chars = currentSuffix.toCharArray()
                def index = chars.length - 1
                while (index >= 0 && chars[index] == 'z' as char) {
                    chars[index] = 'a' as char
                    index--
                }
                buildSuffix = index < 0 ? "a${new String(chars)}" : new String(chars)
                if (index >= 0) {
                    chars[index] = (char) (chars[index] + 1)
                    buildSuffix = new String(chars)
                }
            }
        }
        if (buildSuffix.isBlank()) {
            buildSuffix = "a"
        }
        if (shouldIncrementDesktopBuildSuffix) {
            suffixFile.parentFile.mkdirs()
            suffixFile.text = buildSuffix
        }

        def baseVersion = desktopBaseVersion
        def displayVersion = "${baseVersion}${buildSuffix}"
        def outputDir = desktopBuildInfoDir.get().asFile
        def outputFile = new File(outputDir, "org/openardf/radiooracle/desktop/DesktopBuildInfo.kt")
        outputFile.parentFile.mkdirs()
        outputFile.text = """package org.openardf.radiooracle.desktop

object DesktopBuildInfo {
    const val baseVersion: String = "${baseVersion}"
    const val buildSuffix: String = "${buildSuffix}"
    const val displayVersion: String = "${displayVersion}"
    const val windowTitle: String = "Radio-Oracle Desktop ${displayVersion}"
}
"""
    }
}

tasks.named("compileKotlin") {
    dependsOn(tasks.named("generateDesktopBuildInfo"))
}

tasks.register("verifyDesktopDistributable") {
    group = "distribution"
    description = "Verifies that the local Compose Desktop app image exists."

    dependsOn(tasks.named("createDistributable"))

    doLast {
        def distributionDir = desktopDistributableDir.get().asFile
        if (!distributionDir.isDirectory()) {
            throw new GradleException("Expected desktop distribution directory at ${distributionDir.absolutePath}")
        }
        if (distributionDir.listFiles() == null || distributionDir.listFiles().length == 0) {
            throw new GradleException("Desktop distribution directory is empty: ${distributionDir.absolutePath}")
        }

        if (System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("mac")) {
            def appBundle = new File(distributionDir, "${desktopAppName}.app")
            if (!appBundle.isDirectory()) {
                throw new GradleException("Expected macOS app bundle at ${appBundle.absolutePath}")
            }
            def launcher = new File(appBundle, "Contents/MacOS/${desktopAppName}")
            if (!launcher.isFile() || !launcher.canExecute()) {
                throw new GradleException("Expected executable macOS launcher at ${launcher.absolutePath}")
            }
        }
    }
}

tasks.register("stageDesktopJdeployLibs", Sync) {
    group = "distribution"
    description = "Stages desktop runtime dependencies for the Radio-Oracle jDeploy bundle."

    from(runtimeClasspath)
    into(desktopJdeployLibsDir)
}

tasks.register("desktopJdeployJar", Jar) {
    group = "distribution"
    description = "Builds an executable desktop jar for jDeploy."

    dependsOn(tasks.named("jar"))
    dependsOn(tasks.named("stageDesktopJdeployLibs"))

    archiveFileName = desktopJdeployJarName
    destinationDirectory = desktopJdeployBundleDir

    from({
        zipTree(tasks.named("jar").get().archiveFile.get().asFile)
    })

    doFirst {
        def runtimeClasspathEntries = []
        runtimeClasspath.files.each { file ->
            runtimeClasspathEntries.add("libs/${file.name}")
        }
        runtimeClasspathEntries.sort()

        manifest {
            attributes(
                    "Main-Class": desktopMainClass,
                    "Class-Path": runtimeClasspathEntries.join(" "),
                    "Implementation-Title": desktopAppName,
                    "Implementation-Version": desktopImplementationVersion
            )
        }
    }
}

def desktopJdeployJarFile = tasks.named("desktopJdeployJar").flatMap { it.archiveFile }

tasks.register("prepareDesktopJdeployBundle") {
    group = "distribution"
    description = "Prepares the executable jar and dependency layout needed by jDeploy."

    dependsOn(tasks.named("stageDesktopJdeployLibs"))
    dependsOn(tasks.named("desktopJdeployJar"))
}

tasks.register("verifyDesktopJdeployBundle") {
    group = "distribution"
    description = "Verifies that the generated Radio-Oracle jDeploy jar is executable and references staged dependencies."

    dependsOn(tasks.named("prepareDesktopJdeployBundle"))

    doLast {
        def jarFile = desktopJdeployJarFile.get().asFile
        if (!jarFile.isFile()) {
            throw new GradleException("Expected jDeploy jar at ${jarFile.absolutePath}")
        }

        new JarFile(jarFile).withCloseable { archive ->
            def manifest = archive.manifest
            if (manifest == null) {
                throw new GradleException("Generated jDeploy jar is missing a manifest.")
            }
            def attributes = manifest.mainAttributes
            def mainClass = attributes.getValue("Main-Class")
            if (mainClass != desktopMainClass) {
                throw new GradleException("Expected Main-Class=${desktopMainClass} but found ${mainClass ?: "<missing>"}")
            }

            def classPathEntries = (attributes.getValue("Class-Path") ?: "")
                    .split(" ")
                    .findAll { it }
            if (classPathEntries.isEmpty()) {
                throw new GradleException("Generated jDeploy jar is missing a Class-Path manifest entry.")
            }

            classPathEntries.each { relativePath ->
                def dependencyFile = new File(jarFile.parentFile, relativePath)
                if (!dependencyFile.isFile()) {
                    throw new GradleException("Class-Path entry ${relativePath} does not exist next to the generated jDeploy jar.")
                }
            }
        }
    }
}

