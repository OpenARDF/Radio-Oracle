// Opt-in real-terrain acceptance can reproduce older snapshots retaining every venue grid.
// Ordinary synthetic unit tests keep Gradle's normal heap limit.
tasks.withType(Test).configureEach {
    systemProperty "radiooracle.appDataDirectory", layout.buildDirectory.dir("test-state/app-data").get().asFile.absolutePath
    systemProperty "java.util.prefs.userRoot", layout.buildDirectory.dir("test-state/preferences").get().asFile.absolutePath
    def routeSmokeArchive = providers.environmentVariable("RADIO_ORACLE_ROUTE_SMOKE_ARCHIVE").orElse("").get()
    def routeSmokeBaseline = providers.environmentVariable("RADIO_ORACLE_ROUTE_SMOKE_BASELINE").orElse("").get()
    environment "RADIO_ORACLE_ROUTE_SMOKE_ARCHIVE", routeSmokeArchive
    environment "RADIO_ORACLE_ROUTE_SMOKE_BASELINE", routeSmokeBaseline
    if (!routeSmokeArchive.isBlank()) {
        maxHeapSize = "3g"
    }
}

