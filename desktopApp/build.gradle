tasks.matching { task ->
    task.name == "createDistributable"
}.configureEach {
    doLast {
        if (!System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("mac")) {
            return
        }

        def appBundle = new File(desktopDistributableDir.get().asFile, "${desktopAppName}.app")
        def infoPlist = new File(appBundle, "Contents/Info.plist")
        def appResources = new File(appBundle, "Contents/Resources")
        def packagedSeriesIcon = new File(appResources, "Radio-Oracle-Series.icns")
        def sourceSeriesIcon = macOSSeriesDocumentIcon.asFile

        if (!infoPlist.isFile()) {
            throw new GradleException("Expected macOS Info.plist at ${infoPlist.absolutePath}")
        }
        if (!sourceSeriesIcon.isFile()) {
            throw new GradleException("Expected series document icon at ${sourceSeriesIcon.absolutePath}")
        }
        appResources.mkdirs()
        Files.copy(
                sourceSeriesIcon.toPath(),
                packagedSeriesIcon.toPath(),
                StandardCopyOption.REPLACE_EXISTING
        )

        // Compose currently writes the MIME value as a scalar and adds the
        // association icon after jpackage signs the bundle. Normalize the
        // document declaration and then sign the completed bundle so macOS
        // Launch Services will accept it as the owner of .roseries files.
        runDesktopPackagingCommand([
                "/usr/bin/plutil",
                "-replace",
                "CFBundleDocumentTypes.0.CFBundleTypeMIMETypes",
                "-json",
                "[\"application/vnd.openardf.radio-oracle-series+zip\"]",
                infoPlist.absolutePath
        ])
        runDesktopPackagingCommand([
                "/usr/bin/plutil",
                "-replace",
                "CFBundleDocumentTypes.0.LSItemContentTypes",
                "-json",
                "[\"org.openardf.radiooracle.series\"]",
                infoPlist.absolutePath
        ])
        runDesktopPackagingCommand([
                "/usr/bin/codesign",
                "--force",
                "--deep",
                "--sign",
                "-",
                appBundle.absolutePath
        ])
    }
}

tasks.matching { task ->
